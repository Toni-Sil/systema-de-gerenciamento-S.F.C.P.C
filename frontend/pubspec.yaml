name: frontend
description: "S.F.C.P.C - Sistema de Gestão Agêntica para Sofás"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.1

# Plataformas suportadas: apenas Android
flutter:
  uses-material-design: true
  # Restringe o projeto a Android exclusivamente
  # Para remover ios/web do build, use: flutter config --no-enable-ios --no-enable-web

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State
  provider: ^6.1.5+1

  # Network
  http: ^1.6.0

  # Charts
  fl_chart: ^1.1.1

  # Storage
  shared_preferences: ^2.5.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Storage (AES-256 via Android Keystore)
  flutter_secure_storage: ^9.2.4

  # Scanner
  mobile_scanner: ^5.2.3

  # WhatsApp / Share
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # PDF Relatório
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.5

  # Onboarding
  tutorial_coach_mark: ^1.2.11

  # Conectividade Offline
  connectivity_plus: ^6.1.4

  # ── AGENDA MODULE ───────────────────────────────────
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.9
