name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint + Format check (ruff)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  # --------------------------------------------------------------------------
  # Job 2: Static type checking (mypy)
  # --------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy types-jwt

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --strict

  # --------------------------------------------------------------------------
  # Job 3: Unit & integration tests (pytest)
  # --------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfcpc
          POSTGRES_PASSWORD: sfcpc_test
          POSTGRES_DB: sfcpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: "ci-test-secret-not-for-production"
      DATABASE_URL: "postgresql+asyncpg://sfcpc:sfcpc_test@localhost:5432/sfcpc_test"
      ACCESS_TOKEN_EXPIRE_SECONDS: "3600"
      ALLOWED_ORIGINS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations (Alembic)
        run: alembic upgrade head
        working-directory: ./
        continue-on-error: true  # Remove once Alembic is configured

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
