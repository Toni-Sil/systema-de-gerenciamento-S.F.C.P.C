name: S.F.C.P.C - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic pytest httpx

    - name: Run Schema Linter
      run: |
        # Em produção aqui rodaria check de migrations
        echo "Validating SQL Schema..."

    - name: Run Integration Tests (Multi-tenancy & EDA)
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python tests/test_multi_tenancy.py
        python tests/test_movements_eda.py

    - name: Security Check (SSDLC)
      run: |
        # Simulação de análise de segredos expostos
        echo "Running security scan..."
