name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint + Format (ruff)
  # --------------------------------------------------------------------------
  lint:
    name: 🔍 Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # --------------------------------------------------------------------------
  # Job 2: Static type checking (mypy)
  # --------------------------------------------------------------------------
  typecheck:
    name: 📝 Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt mypy types-jwt
      - run: mypy src/ --ignore-missing-imports

  # --------------------------------------------------------------------------
  # Job 3: Backend tests (pytest + coverage)
  # --------------------------------------------------------------------------
  test-backend:
    name: 🧪 Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sfcpc
          POSTGRES_PASSWORD: sfcpc_test
          POSTGRES_DB: sfcpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5
    env:
      JWT_SECRET_KEY: "ci-test-secret-not-for-production"
      DATABASE_URL: "postgresql+asyncpg://sfcpc:sfcpc_test@localhost:5432/sfcpc_test"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
      ACCESS_TOKEN_EXPIRE_SECONDS: "3600"
      ALLOWED_ORIGINS: "*"
      LLM_PROVIDER: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt pytest-cov
      - name: Run Alembic migrations
        run: alembic upgrade head
        continue-on-error: true
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # --------------------------------------------------------------------------
  # Job 4: Frontend tests (Vitest)
  # --------------------------------------------------------------------------
  test-frontend:
    name: 🌐 Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # --------------------------------------------------------------------------
  # Job 5: Docker build check
  # --------------------------------------------------------------------------
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sfcpc-api:ci .
      - name: Build frontend image
        run: docker build -t sfcpc-frontend:ci ./frontend
