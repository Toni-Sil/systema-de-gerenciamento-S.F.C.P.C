name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: sqlite+aiosqlite:///:memory:

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn sqlalchemy asyncpg aiosqlite \
            pydantic[email] python-jose[cryptography] bcrypt \
            pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        working-directory: src
        run: pytest ../tests/ -v --tb=short --asyncio-mode=auto

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt || true
