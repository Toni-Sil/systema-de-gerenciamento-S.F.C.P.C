# Prometheus scrape configuration for S.F.C.P.C

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: sfcpc

rule_files: []

scrape_configs:

  # FastAPI application metrics
  - job_name: sfcpc_api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # PostgreSQL metrics (requires postgres_exporter sidecar — optional)
  # - job_name: sfcpc_postgres
  #   static_configs:
  #     - targets: ["postgres_exporter:9187"]

  # RabbitMQ metrics (built-in Prometheus plugin)
  # - job_name: sfcpc_rabbitmq
  #   static_configs:
  #     - targets: ["rabbitmq:15692"]
