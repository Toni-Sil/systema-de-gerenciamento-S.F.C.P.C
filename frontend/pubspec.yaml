name: frontend
description: "S.F.C.P.C - Sistema de Gestão Agêntica para Sofás"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State
  provider: ^6.1.5+1

  # Network
  http: ^1.6.0

  # Charts
  fl_chart: ^1.1.1

  # Storage
  shared_preferences: ^2.5.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Scanner (Sprint 1)
  mobile_scanner: ^5.2.3

  # WhatsApp / Share (Sprint 2)
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # PDF Relatório (Sprint 2)
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.5

  # Onboarding (Sprint 1)
  tutorial_coach_mark: ^1.2.11

  # Conectividade Offline (Sprint 4)
  connectivity_plus: ^6.1.4

  # ── AGENDA MODULE (Sprint 5) ──────────────────────────────
  # Reconhecimento de voz
  speech_to_text: ^7.0.0

  # Notificações locais agendadas
  flutter_local_notifications: ^18.0.1

  # Fusos horários (necessário para zonedSchedule)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
